name: family-todo

# Photos are stored in Telegram (file_id + message_id only persisted in
# Postgres), so we no longer need an S3-compatible object store. The MinIO
# and `minio-init` services were removed in the photo-storage refactor.

services:
  postgres:
    image: postgres:16-alpine
    container_name: family-todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familytodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familytodo}
      POSTGRES_DB: ${POSTGRES_DB:-familytodo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familytodo} -d ${POSTGRES_DB:-familytodo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: family-todo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: family-todo-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

volumes:
  postgres-data:
  redis-data:
