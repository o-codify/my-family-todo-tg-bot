name: family-todo-prod

# Production-style stack. Extends the base compose with the app services
# (api, bot, miniapp) built from the in-repo Dockerfiles.
#
# Run from repo root:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# Migrations: run once after `up` from a host shell:
#   docker compose exec api node apps/api/dist/db/migrate.js
# or build a dedicated one-shot service (commented out below).

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: family-todo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-familytodo}:${POSTGRES_PASSWORD:-familytodo}@postgres:5432/${POSTGRES_DB:-familytodo}
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
      API_HOST: 0.0.0.0
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      WEBAPP_URL: ${WEBAPP_URL}
      PHOTO_MAX_SIZE_BYTES: ${PHOTO_MAX_SIZE_BYTES:-10485760}
      PHOTO_MAX_COUNT_PER_OCCURRENCE: ${PHOTO_MAX_COUNT_PER_OCCURRENCE:-3}
      PHOTO_ALLOWED_MIME: ${PHOTO_ALLOWED_MIME:-image/jpeg,image/png,image/webp}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: family-todo-bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      WEBAPP_URL: ${WEBAPP_URL}
      BOT_API_BASE_URL: http://api:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Set TELEGRAM_WEBHOOK_URL in your prod .env to switch to webhook mode.
      # The URL must be public HTTPS — Telegram won't deliver to plain HTTP.
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      BOT_PORT: 3001
      BOT_HOST: 0.0.0.0
    ports:
      # Only useful in webhook mode. In long-polling mode nothing listens here.
      - "${BOT_PORT:-3001}:3001"

  miniapp:
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_TG_BOT_USERNAME: ${VITE_TG_BOT_USERNAME}
    container_name: family-todo-miniapp
    restart: unless-stopped
    ports:
      - "${MINIAPP_PORT:-8080}:80"

  # One-shot migration service. Run on demand with:
  #   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml run --rm migrate
  # Builds from the api image because the migrations file ships in there.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: family-todo-migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-familytodo}:${POSTGRES_PASSWORD:-familytodo}@postgres:5432/${POSTGRES_DB:-familytodo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["node", "apps/api/dist/db/migrate.js"]
