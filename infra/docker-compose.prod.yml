name: family-todo-prod

# Production-style stack. Extends the base compose with the single `app`
# service built from the root Dockerfile — one container holding the API,
# the Telegram bot and the Mini App bundle.
#
# Run from repo root:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# Migrations run automatically on boot (see the note at the bottom).

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Vite inlines these at build time — changing them means a rebuild.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_TG_BOT_USERNAME: ${VITE_TG_BOT_USERNAME}
    container_name: family-todo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-familytodo}:${POSTGRES_PASSWORD:-familytodo}@postgres:5432/${POSTGRES_DB:-familytodo}
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
      API_HOST: 0.0.0.0
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      WEBAPP_URL: ${WEBAPP_URL}
      # Setting TELEGRAM_WEBHOOK_URL is what turns the bot on inside this
      # process: the handler is mounted at {URL}/webhook. Must be public
      # HTTPS — Telegram won't deliver to plain HTTP. Leave it empty to
      # run API-only.
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # The bot talks to the API over loopback — same process, same port.
      BOT_API_BASE_URL: http://127.0.0.1:3000
      PHOTO_MAX_SIZE_BYTES: ${PHOTO_MAX_SIZE_BYTES:-10485760}
      PHOTO_MAX_COUNT_PER_OCCURRENCE: ${PHOTO_MAX_COUNT_PER_OCCURRENCE:-3}
      PHOTO_ALLOWED_MIME: ${PHOTO_ALLOWED_MIME:-image/jpeg,image/png,image/webp}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # NOTE: there's no separate `migrate` service — the API boot sequence
  # runs `runMigrations()` automatically before binding the port. A
  # Postgres advisory lock keeps concurrent replicas safe. If you ever
  # need to run migrations from a shell (e.g. dry-run a rollback), use:
  #   docker compose exec app node apps/api/dist/db/migrate.js
