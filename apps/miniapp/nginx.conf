server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed asset filenames Vite emits (eg. assets/foo-XXXX.js).
  # The bundle uses content hashes, so anything under /assets/ is immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — Mini App uses a hash router, but any /unknown URL still
  # needs to serve index.html so cold loads work.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Compression knocks ~70% off the JS bundle.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;
}
